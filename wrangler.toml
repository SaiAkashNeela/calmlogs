compatibility_flags = ["nodejs_compat"]
name = "calmlogs"
main = "worker/src/index.ts"
compatibility_date = "2024-03-20"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "calmlogs-db"
database_id = "82710962-22ac-419e-a159-7a6da3f24ac1"
migrations_dir = "migrations"
# NOTE: Cloudflare does NOT auto-apply D1 migrations on deploy/build.
# Run migrations using:
#   Local:  bun run db:migrate:local   (npx wrangler d1 migrations apply DB --local)
#   Remote: bun run db:migrate:remote  (npx wrangler d1 migrations apply DB --remote)
# Or run "bun run deploy" which automatically migrates and deploys.

[[r2_buckets]]
binding = "LOG_BUCKET"
bucket_name = "calmlogs-bucket"

[durable_objects]
bindings = [
  { name = "REALTIME", class_name = "RealtimeLogStream" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RealtimeLogStream"]

[vars]
# REQUIRED FOR PRODUCTION AUTHENTICATION:
# 1. Cloudflare Secrets:
#    npx wrangler secret put GOOGLE_CLIENT_ID
#    npx wrangler secret put GOOGLE_CLIENT_SECRET
#    npx wrangler secret put BETTER_AUTH_SECRET
#
# 2. Production Base URL:
#    Set BETTER_AUTH_URL to your production domain:
#    BETTER_AUTH_URL = "https://<your-worker-subdomain>.workers.dev"
#
# 3. Google Cloud Console (OAuth 2.0 Web Client) Settings:
#    - Authorized JavaScript origins (JS URL):
#      Local:      http://localhost:3000
#      Production: https://<your-worker-subdomain>.workers.dev
#    - Authorized redirect URIs (OAuth Redirect):
#      Local:      http://localhost:3000/api/auth/callback/google
#      Production: https://<your-worker-subdomain>.workers.dev/api/auth/callback/google
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
